<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>动态粒子与3D立方体动画</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050510;
            font-family: 'Arial', sans-serif;
        }
        #info {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            letter-spacing: 2px;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            z-index: 10;
        }
        @media (max-width: 600px) {
            #info {
                font-size: 10px;
                bottom: 15px;
            }
        }
    </style>
</head>
<body>
    <div id="info">✨ 动态粒子系统 • 旋转立方体 • Three.js</div>

    <!-- 引入 Three.js 核心库和附加组件 -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- 初始化场景、相机、渲染器 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);

        // 相机：透视相机，视野60度，宽高比根据窗口调整，近裁面0.1，远裁面1000
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 3, 8);
        camera.lookAt(0, 0, 0);

        // WebGL渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = false; // 本场景不需要阴影提升性能
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // 辅助：CSS2渲染器用于简单的文字标签（可选），此处不加，保持纯净

        // --- 添加控制器 (注释掉以保持自动旋转，若需交互可取消注释) ---
        // const controls = new OrbitControls(camera, renderer.domElement);
        // controls.enableDamping = true;
        // controls.autoRotate = false;
        // controls.enableZoom = true;

        // --- 光照 ---
        // 环境光提供基础照明
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);

        // 主光源 - 暖色方向光
        const mainLight = new THREE.DirectionalLight(0xffdd99, 1.2);
        mainLight.position.set(2, 5, 3);
        scene.add(mainLight);

        // 辅助光源 - 冷色背光
        const backLight = new THREE.DirectionalLight(0x99ccff, 0.8);
        backLight.position.set(-3, 1, -4);
        scene.add(backLight);

        // 点光源增加局部辉光
        const pointLight = new THREE.PointLight(0xff66aa, 0.5, 10);
        pointLight.position.set(1, 2, 2);
        scene.add(pointLight);

        // 添加一个简单的辅助光晕效果（不可见，仅用于氛围）
        const fillLight = new THREE.HemisphereLight(0x4466ff, 0xaa44ff, 0.6);
        scene.add(fillLight);

        // --- 核心物体：旋转的3D立方体 (带边缘光效) ---
        const cubeGroup = new THREE.Group();

        // 主立方体：半透明，渐变颜色
        const geometry = new THREE.BoxGeometry(1.8, 1.8, 1.8);
        const material = new THREE.MeshStandardMaterial({
            color: 0x6a5acd,
            emissive: 0x1a1a4a,
            roughness: 0.2,
            metalness: 0.8,
            transparent: true,
            opacity: 0.92,
        });
        const cube = new THREE.Mesh(geometry, material);
        cube.castShadow = true;
        cube.receiveShadow = true;
        cubeGroup.add(cube);

        // 内部小立方体：发光核心
        const innerGeo = new THREE.BoxGeometry(1.0, 1.0, 1.0);
        const innerMat = new THREE.MeshStandardMaterial({
            color: 0xffaa88,
            emissive: 0xff5500,
            emissiveIntensity: 0.5,
            roughness: 0.1,
            metalness: 0.3,
        });
        const innerCube = new THREE.Mesh(innerGeo, innerMat);
        innerCube.castShadow = false;
        innerCube.receiveShadow = false;
        cubeGroup.add(innerCube);

        // 边缘线条：发光边框
        const edges = new THREE.EdgesGeometry(geometry);
        const lineMat = new THREE.LineBasicMaterial({ 
            color: 0x88ccff, 
            transparent: true, 
            opacity: 0.6 
        });
        const wireframe = new THREE.LineSegments(edges, lineMat);
        wireframe.scale.set(1.02, 1.02, 1.02);
        cubeGroup.add(wireframe);

        // 添加一些漂浮的小粒子围绕立方体 (小星星)
        const starCount = 60;
        const starGeo = new THREE.BufferGeometry();
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            // 随机分布在半径 1.8 到 2.8 的球壳上
            const radius = 1.8 + Math.random() * 1.2;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            starPositions[i*3] = Math.sin(phi) * Math.cos(theta) * radius;
            starPositions[i*3+1] = Math.sin(phi) * Math.sin(theta) * radius;
            starPositions[i*3+2] = Math.cos(phi) * radius;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMat = new THREE.PointsMaterial({
            color: 0xffaa88,
            size: 0.08,
            transparent: true,
            blending: THREE.AdditiveBlending,
        });
        const stars = new THREE.Points(starGeo, starMat);
        cubeGroup.add(stars);

        scene.add(cubeGroup);

        // 让立方体组稍微倾斜
        cubeGroup.rotation.x = 0.3;
        cubeGroup.rotation.y = 0.5;
        cubeGroup.rotation.z = 0.1;

        // --- 粒子系统：背景星空 (大量粒子) ---
        const particleCount = 2500;
        const particlesGeo = new THREE.BufferGeometry();
        const posArray = new Float32Array(particleCount * 3);
        const colorArray = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount; i++) {
            // 分布在更大的球体空间内
            const radius = 12 + Math.random() * 18;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            posArray[i*3] = Math.sin(phi) * Math.cos(theta) * radius;
            posArray[i*3+1] = Math.sin(phi) * Math.sin(theta) * radius;
            posArray[i*3+2] = Math.cos(phi) * radius;

            // 随机颜色：蓝紫色到粉色
            const r = 0.4 + Math.random() * 0.6;
            const g = 0.3 + Math.random() * 0.5;
            const b = 0.8 + Math.random() * 0.4;
            colorArray[i*3] = r;
            colorArray[i*3+1] = g * 0.6;
            colorArray[i*3+2] = b;
        }
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        particlesGeo.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));

        const particleTexture = (() => {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.4, 'rgba(255,255,255,0.8)');
            gradient.addColorStop(0.6, 'rgba(200,200,255,0.4)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 32, 32);
            return new THREE.CanvasTexture(canvas);
        })();

        const particlesMat = new THREE.PointsMaterial({
            size: 0.25,
            map: particleTexture,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            vertexColors: true,
            opacity: 0.9,
            sizeAttenuation: true,
        });

        const particleSystem = new THREE.Points(particlesGeo, particlesMat);
        scene.add(particleSystem);

        // --- 额外：一些漂浮的更大星星 (作为点缀) ---
        const bigStarCount = 80;
        const bigStarGeo = new THREE.BufferGeometry();
        const bigStarPos = new Float32Array(bigStarCount * 3);
        for (let i = 0; i < bigStarCount; i++) {
            const radius = 10 + Math.random() * 20;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            bigStarPos[i*3] = Math.sin(phi) * Math.cos(theta) * radius;
            bigStarPos[i*3+1] = Math.sin(phi) * Math.sin(theta) * radius;
            bigStarPos[i*3+2] = Math.cos(phi) * radius;
        }
        bigStarGeo.setAttribute('position', new THREE.BufferAttribute(bigStarPos, 3));
        const bigStarMat = new THREE.PointsMaterial({
            color: 0x88aaff,
            size: 0.5,
            transparent: true,
            blending: THREE.AdditiveBlending,
            opacity: 0.4,
            sizeAttenuation: true,
            map: particleTexture,
        });
        const bigStars = new THREE.Points(bigStarGeo, bigStarMat);
        scene.add(bigStars);

        // --- 辅助：添加一些光线/射线效果 (装饰) ---
        // 这里简单添加几个悬浮的线条环
        const ringCount = 3;
        const rings = [];
        for (let i = 0; i < ringCount; i++) {
            const radius = 2.2 + i * 0.6;
            const curve = new THREE.EllipseCurve(
                0, 0,            // ax, aY
                radius, radius,  // xRadius, yRadius
                0, 2 * Math.PI,  // aStartAngle, aEndAngle
                false,          // aClockwise
                0               // rotation
            );
            const points = curve.getPoints(50);
            const ringGeo = new THREE.BufferGeometry().setFromPoints(points);
            const ringMat = new THREE.LineBasicMaterial({ 
                color: new THREE.Color(`hsl(${200 + i * 30}, 70%, 60%)`),
                transparent: true,
                opacity: 0.2 + i * 0.1,
            });
            const ring = new THREE.Line(ringGeo, ringMat);
            ring.rotation.x = 0.8;
            ring.rotation.y = 0.4 + i * 0.3;
            ring.rotation.z = 0.2;
            scene.add(ring);
            rings.push(ring);
        }

        // --- 动画变量 ---
        let clock = new THREE.Clock();

        // --- 窗口自适应 ---
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- 动画循环 ---
        function animate() {
            const delta = clock.getDelta();
            const elapsedTime = performance.now() * 0.001; // seconds

            // 旋转主立方体组
            cubeGroup.rotation.y += 0.005;
            cubeGroup.rotation.x = 0.3 + Math.sin(elapsedTime * 0.2) * 0.1;
            cubeGroup.rotation.z += 0.002;

            // 内部小立方体反向旋转，制造动态效果
            innerCube.rotation.x += 0.01;
            innerCube.rotation.y += 0.015;

            // 边缘线框轻微缩放脉冲
            const scalePulse = 1 + Math.sin(elapsedTime * 2) * 0.01;
            wireframe.scale.set(1.02 * scalePulse, 1.02 * scalePulse, 1.02 * scalePulse);

            // 环绕立方体的星星旋转
            stars.rotation.y += 0.005;
            stars.rotation.x += 0.002;

            // 背景粒子系统缓慢旋转
            particleSystem.rotation.y += 0.0002;
            particleSystem.rotation.x += 0.0001;
            bigStars.rotation.y += 0.0003;
            bigStars.rotation.x += 0.0001;

            // 环旋转
            rings.forEach((ring, index) => {
                ring.rotation.y += 0.002 * (index + 1);
                ring.rotation.x += 0.001 * (index + 1);
            });

            // 相机轻微环绕 (可选) - 取消注释可实现自动环绕
            // camera.position.x = 8 * Math.sin(elapsedTime * 0.05);
            // camera.position.z = 8 * Math.cos(elapsedTime * 0.05);
            // camera.lookAt(0, 0, 0);

            // 更新控制器 (如果启用)
            // controls.update();

            // 渲染
            renderer.render(scene, camera);

            requestAnimationFrame(animate);
        }

        animate();

        // 简单的防浏览器休眠（保持动画流畅）
        // 无需额外操作

        console.log('✨ 动画已启动！');
    </script>
</body>
</html>
