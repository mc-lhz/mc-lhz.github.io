<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --bg: #ffffff;
        --bg-soft: #ffffff;
        --bg-row: #f9fafb;
        --text: #111827;
        --text-mid: #4b5563;
        --text-soft: #9ca3af;
        --border: #e5e7eb;
        --input-bg: #ffffff;
        --card-bg: #ffffff;
        --primary: #2563eb;
        --primary-lt: #3b82f6;
        --chip-bg: #f3f4f6;
        --chip-border: #e5e7eb;
        --yellow-bg: #fffbeb;
        --yellow-border: #fde68a;
        --yellow-text: #92400e;
        --hover: #f3f4f6;
        --shadow: 0 1px 2px rgba(0,0,0,.05);
        color-scheme: light;
    }

    html.dark {
        --bg: #111827;
        --bg-soft: #111827;
        --bg-row: #1f2937;
        --text: #f9fafb;
        --text-mid: #9ca3af;
        --text-soft: #6b7280;
        --border: #374151;
        --input-bg: #1f2937;
        --card-bg: #1f2937;
        --primary: #3b82f6;
        --primary-lt: #60a5fa;
        --chip-bg: #1f2937;
        --chip-border: #374151;
        --yellow-bg: rgba(113,63,18,.2);
        --yellow-border: #92600b;
        --yellow-text: #fbbf24;
        --hover: #293548;
        color-scheme: dark;
    }

    body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        transition: background .2s, color .2s;
        -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }

    .header { border-bottom: 1px solid var(--border); }
    .header-inner {
        max-width: 1280px; margin: 0 auto; padding: 0 1.5rem;
        display: flex; align-items: center; justify-content: space-between; height: 64px;
    }
    .brand { display: flex; align-items: center; gap: .5rem; }
    .brand .logo {
        width: 40px; height: 40px; border-radius: 8px;
        display: flex; align-items: center; justify-content: center;
        background: var(--card-bg); border: 1px solid var(--border);
    }
    .brand .logo svg { width: 30px; height: 30px; fill: var(--text); }
    .brand .name { font-size: 1.25rem; font-weight: 600; }
    .brand .name:hover { opacity: .8; }
    .header-actions { display: flex; align-items: center; gap: .5rem; }
    .btn-ghost {
        display: inline-flex; align-items: center; gap: .5rem;
        background: var(--chip-bg); border: 1px solid var(--border);
        color: var(--text); border-radius: 8px; padding: .45rem .9rem;
        font-size: .8125rem; font-weight: 600; line-height: 17px;
        transition: background .15s;
    }
    .btn-ghost:hover { background: var(--hover); }
    .btn-ghost svg { width: 15px; height: 15px; }
    .icon-btn {
        width: 34px; height: 31px; border-radius: 8px;
        display: flex; align-items: center; justify-content: center;
        background: var(--chip-bg); border: 1px solid var(--border); color: var(--text-mid);
        transition: background .15s;
    }
    .icon-btn:hover { background: var(--hover); }
    .icon-btn svg { width: 16px; height: 16px; }

    .main { flex: 1; max-width: 1000px; margin: 0 auto; padding: 2rem 1.25rem 4rem; width: 100%; }
    .hero { text-align: center; padding-top: 1rem; margin-bottom: 2.5rem; }
    .hero h1 { font-size: 3rem; font-weight: 700; letter-spacing: -.02em; }
    .hero h1 span { color: var(--primary); }
    .hero p { color: var(--text-mid); margin-top: .75rem; font-size: 1rem; }

    .url-row { display: flex; flex-direction: column; gap: .75rem; }
    @media (min-width: 640px) { .url-row { flex-direction: row; align-items: flex-start; } }
    .url-input {
        flex: 1; width: 100%;
        height: 48px; padding: 0 1rem;
        background: var(--input-bg); color: var(--text);
        border: 1px solid var(--border); border-radius: 8px;
        font-size: .9375rem; outline: none;
        transition: border-color .15s, box-shadow .15s;
    }
    .url-input::placeholder { color: var(--text-soft); }
    .url-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,130,246,.2); }
    .url-btn {
        height: 48px; padding: 0 1.5rem; border-radius: 8px;
        font-size: .9375rem; font-weight: 500;
        white-space: nowrap; transition: background .15s;
    }
    .url-btn:hover { background: var(--hover); }
    #get-btn {
        border: 1px solid var(--primary);
        background: var(--primary);
        color: var(--bg);
    }
    #open-btn {
        border: 1px solid var(--primary);
        background: var(--card-bg);
        color: var(--text-mid);
    }

    .info-bar {
        display: flex; flex-wrap: wrap; align-items: center; gap: .6rem;
        margin-top: 1.25rem; padding: .75rem 1rem;
        background: var(--bg-row); border: 1px solid var(--border); border-radius: 8px;
        color: var(--text-mid); font-size: .8125rem;
    }
    .info-bar b { color: var(--text); font-weight: 600; }
    .info-bar .code { font-family: ui-monospace, "SF Mono", Consolas, Menlo, monospace; }

    .notice {
        display: flex; align-items: flex-start; gap: .75rem;
        background: var(--yellow-bg); border: 1px solid var(--yellow-border);
        border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem; color: var(--yellow-text);
        font-size: .875rem;
    }
    .notice svg { width: 20px; height: 20px; flex-shrink: 0; margin-top: 1px; }

    .footer { border-top: 1px solid var(--border); padding: 3rem 1.5rem 2rem; margin-top: auto; }
    .footer-inner { max-width: 1280px; margin: 0 auto; }
    .footer-cols { display: flex; flex-direction: column; gap: 2rem; }
    @media (min-width: 1024px) { .footer-cols { flex-direction: row; gap: 6rem; justify-content: space-between; } }
    .footer-brand { max-width: 20rem; }
    .footer-brand h3 { font-size: 1.5rem; font-weight: 700; }
    .footer-brand h3 span { color: var(--primary); }
    .footer-brand p { margin-top: 1rem; color: var(--text-soft); font-size: .875rem; line-height: 1.4; }
    .footer-social { display: flex; gap: 1.2rem; margin-top: 1.25rem; color: var(--text-soft); }
    .footer-social a:hover { color: var(--primary); }
    .footer-social svg { width: 22px; height: 22px; }
    .footer-grid { flex: 1; display: grid; grid-template-columns: 1fr; gap: 2rem; }
    @media (min-width: 640px) { .footer-grid { grid-template-columns: 1fr 1fr; } }
    @media (min-width: 1024px) { .footer-grid { grid-template-columns: repeat(3, 1fr); } }
    .footer-col p { font-weight: 600; }
    .footer-col .links { margin-top: 1.25rem; display: flex; flex-direction: column; gap: .9rem; font-size: .875rem; }
    .footer-col a { color: var(--text-soft); }
    .footer-col a:hover { opacity: .75; }
    .footer-bottom {
        margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--border);
        display: flex; flex-direction: column; gap: 1rem; align-items: center; justify-content: space-between;

    }
    @media (min-width: 640px) { .footer-bottom { flex-direction: row; } }
    .footer-bottom .icp { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
    .footer-bottom a:hover { color: var(--text); }
    .footer-bottom .back-home { font-weight: 500; color: var(--text-mid); }
</style>

<script>
    const BASE_URL = "mc-lhz.de5.net";
    const ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";

    function toBase32(str) {
        const bytes = new TextEncoder().encode(str);
        let bits = 0, value = 0, out = "";
        for (let i = 0; i < bytes.length; i++) {
            value = (value << 8) | bytes[i];
            bits += 8;
            while (bits >= 5) {
                out += ALPHABET[(value >>> (bits - 5)) & 31];
                bits -= 5;
            }
        }
        if (bits > 0) {
            out += ALPHABET[(value << (5 - bits)) & 31];
        }
        return out;
    }

    const $in = document.getElementById("in");
    const $enc = document.getElementById("enc");
    const $copyBtn = document.getElementById("copyBtn");
    let currentLink = "";

    function buildLink(url) {
        if (!(url.startsWith("https://") || url.startsWith("http://"))) {
            url = "https://" + url;
        }
        const parsed = new URL(url);
        const domain = parsed.hostname;
        const route = parsed.pathname + parsed.search;
        const base32Domain = toBase32(domain);
        return "https://" + base32Domain + "." + BASE_URL + route;
    }
    function getGithub(url) {
        // 通过Cloudflare服务获取Github仓库下载/clone链接和release列表
    }
    function copyText(text, btn) {
        function done(ok) {
            const old = btn.textContent;
            btn.textContent = ok ? "已复制" : "复制失败";
            setTimeout(function () { btn.textContent = old; }, 1500);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
        } else {
            const ta = document.createElement("textarea");
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            let ok = false;
            try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
            document.body.removeChild(ta);
            done(ok);
        }
    }
    document.getElementById("get-btn").addEventListener("click", function () {
        const original = document.getElementById("in").value.trim();
        if (!original) {
            return;
        }
        const fullUrl = buildLink(original);
        getGithub(fullUrl);
    });
    document.getElementById("open-btn").addEventListener("click", function () {
        const original = document.getElementById("in").value.trim();
        if (!original) {
            return;
        }
        const fullUrl = buildLink(original);
        currentLink = fullUrl;
        window.open(fullUrl, "_blank");
    });

    document.getElementById("in").addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
            document.getElementById("open-btn").click();
        }
    });


    (function initTheme() {
        let stored = localStorage.getItem("theme") || "system";
        const icons = { light: "iconSun", dark: "iconMoon", system: "iconAuto" };
        function apply(mode) {
            document.documentElement.classList.toggle("dark", mode === "dark");
            ["iconSun", "iconMoon", "iconAuto"].forEach(function (id) {
                document.getElementById(id).style.display = id === icons[mode] ? "" : "none";
            });
        }
        function resolve(raw) {
            if (raw === "dark") return "dark";
            if (raw === "light") return "light";
            return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        apply(resolve(stored));
        document.getElementById("themeBtn").addEventListener("click", function () {
            const order = ["light", "dark", "system"];
            stored = order[(order.indexOf(stored) + 1) % order.length];
            localStorage.setItem("theme", stored);
            apply(resolve(stored));
        });
        window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function (m) {
            if (localStorage.getItem("theme") === "system") apply(resolve("system"));
        });
    })();
</script>
