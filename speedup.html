<!doctype html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <title>Base32 编码器</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 40px; }
        textarea, input { width: 100%; box-sizing: border-box; font-family: monospace; padding: 8px; }
        textarea { height: 100px; }
        button { margin-top: 12px; padding: 8px 16px; font-size: 14px; }
        div { margin-bottom: 16px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; }
        #out { background: #f5f5f5; white-space: pre-wrap; word-break: break-all; }
    </style>
</head>
<body>
    <div>
        <label for="in">输入</label>
        <textarea id="in" placeholder="输入要打开的URL"></textarea>
    </div>
    <button id="enc">打开</button>
    <script>
      const BASE_URL = "mc-lhz.de5.net";
    </script>
    <script>
        const ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";

        function toBase32(str) {
            const bytes = new TextEncoder().encode(str);
            let bits = 0, value = 0, out = "";
            for (let i = 0; i < bytes.length; i++) {
                value = (value << 8) | bytes[i];
                bits += 8;
                while (bits >= 5) {
                    out += ALPHABET[(value >>> (bits - 5)) & 31];
                    bits -= 5;
                }
            }
            if (bits > 0) {
                out += ALPHABET[(value << (5 - bits)) & 31];
            }
            return out; // 去掉了末尾的 '=' 填充
        }

        document.getElementById("enc").addEventListener("click", function () {
            // 提取域名和路由
            var url = document.getElementById("in").value;
            // 补全https://
            if (!(url.startsWith("https://") || url.startsWith("http://"))) {
                url = "https://" + url;
            }
            var parsed = new URL(url);
            var domain = parsed.hostname;
            var route = parsed.pathname + parsed.search;
            var base32Domain = toBase32(domain);

            var fullUrl = `https://${base32Domain}.${BASE_URL}${route}`;
            window.open(fullUrl, "_blank");
        });
    </script>
</body>
</html>
